# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# Documentation: https://wowchemy.com/docs/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
# font: figtree
appearance:
  theme_day: My-theme
  font: avenir-next
  font_size: l
  mode: light

# SEO

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: ''
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
  verification:
    google: ''
    baidu: ''

# Site header

header:
  navbar:
    enable: true
    align: m
    show_logo: false
    show_language: false
    show_day_night: false
    show_search: false
    highlight_active_link: false

# Site footer

footer:
  copyright:
    notice: '© {year} Xinyu Shi. '
    license:
      enable: false
      allow_derivatives: false
      share_alike: false
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Publication teaser card (applies to every teaser image/video in the
# publication lists; rendered by layouts/partials/views/pub.html)

pub_teaser:
  width: 90  # teaser width as % of the default column (or a CSS length like "300px"); the text follows it, no gap opens
  ratio: 2.0  # card aspect ratio, width ÷ height (bigger = shorter card)
  height: ''  # optional explicit CSS height (e.g. "180px"); overrides ratio when set

# Site features

features:
  syntax_highlighter:
    enable: true
    extra_languages:
      - r
      - latex
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'
    content_dir: content
    branch: master
  avatar:
    gravatar: false
    shape: square
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: ''
    api_key: ''
    zoom: 15

# Extensions

extensions:
  cms:
    branch: master
    local_backend: false
  academicons:
    enable: true
